<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Games Hub · OxyPeak</title><link rel="stylesheet" href="games.css"></head>
<body><main>
<header><div class="brand-block"><span class="brand">OxyPeak</span><h1>Games Hub</h1></div><button id="home" class="quiet">← Back to home</button></header>
<section id="overview" aria-label="Choose a game"><div class="intro"><p>A little challenge. A fresh perspective.</p><span>Play at your own pace</span></div>
<div class="choices">
<a class="choice sage" href="https://bosorioo.github.io/wordle-unlimited/" target="_blank" rel="noopener noreferrer"><span class="art wordle-art" aria-hidden="true"><i>W</i><i>O</i><i>R</i></span><div class="card-copy"><span class="category">THE ORIGINAL</span><h2>Wordle</h2><p>Your favorite five-letter challenge.</p></div><span class="go" aria-hidden="true">↗</span></a>
<button class="choice coral" data-game="pairs"><span class="art pairs-art" aria-hidden="true"><i>◇</i><i>◇</i></span><div class="card-copy"><span class="category">MEMORY</span><h2>Matching Pairs</h2><p>Find a match. Make a connection.</p></div><span class="go" aria-hidden="true">→</span></button>
<button class="choice blue" data-game="words"><span class="art letters-art" aria-hidden="true"><i>A</i><i>B</i><i>C</i></span><div class="card-copy"><span class="category">WORD POWER</span><h2>Word Scramble</h2><p>Thousands of words to untangle.</p></div><span class="go" aria-hidden="true">→</span></button>
<button class="choice gold" data-game="tiles"><span class="art numbers-art" aria-hidden="true"><i>1</i><i>2</i><i>3</i></span><div class="card-copy"><span class="category">SPATIAL THINKING</span><h2>Number Slide</h2><p>A place for every piece.</p></div><span class="go" aria-hidden="true">→</span></button>
<button class="choice lavender" data-game="sudoku"><span class="art sudoku-art" aria-hidden="true"><i>1</i><i>4</i><i>3</i><i>2</i></span><div class="card-copy"><span class="category">LOGIC</span><h2>Mini Sudoku</h2><p>Small grid. Satisfying logic.</p></div><span class="go" aria-hidden="true">→</span></button>
<button class="choice peach" data-game="sequence"><span class="art sequence-art" aria-hidden="true"><i>●</i><i>◆</i><i>▲</i></span><div class="card-copy"><span class="category">RECALL</span><h2>Sequence Memory</h2><p>Watch the pattern. Play it back.</p></div><span class="go" aria-hidden="true">→</span></button>
<button class="choice mint" data-game="math"><span class="art math-art" aria-hidden="true"><i>+</i><i>×</i><i>=</i></span><div class="card-copy"><span class="category">MENTAL MATH</span><h2>Number Sense</h2><p>A little everyday number magic.</p></div><span class="go" aria-hidden="true">→</span></button>
<button class="choice rose" data-game="focus"><span class="art focus-art" aria-hidden="true"><i></i><i></i><i></i></span><div class="card-copy"><span class="category">ATTENTION</span><h2>Color Focus</h2><p>Follow the color. Find your focus.</p></div><span class="go" aria-hidden="true">→</span></button>
</div></section>
<section id="play" hidden aria-label="Game"><div class="play-header"><div><span class="eyebrow" id="game-category"></span><h2 id="game-title" tabindex="-1"></h2></div><div class="play-actions"><button id="all-games" class="quiet">All games</button><button id="new-game">New game</button></div></div><p id="instructions"></p><div class="game-surface"><div id="score" class="score"></div><div id="board"></div><p id="result" role="status" aria-live="polite"></p></div></section>
</main><script src="game-words.js"></script><script src="games-core.js"></script><script src="games.js"></script></body></html>
