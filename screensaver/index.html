<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OxyPeak Screensaver</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            color: rgba(248, 250, 252, 0.12);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mark {
            display: flex;
            align-items: center;
            gap: min(3vw, 28px);
            opacity: 0.66;
            animation: slow-drift 90s ease-in-out infinite alternate;
            will-change: transform;
        }

        .ring {
            width: min(16vw, 140px);
            height: min(16vw, 140px);
            border: min(1.05vw, 9px) solid rgba(94, 184, 168, 0.1);
            border-right-color: rgba(62, 139, 187, 0.16);
            border-radius: 50%;
        }

        .word {
            margin-top: -0.03em;
            font-size: clamp(46px, 10vw, 132px);
            font-weight: 800;
            letter-spacing: -0.075em;
            line-height: 0.9;
        }

        .word span {
            color: rgba(94, 184, 168, 0.17);
        }

        @keyframes slow-drift {
            0% {
                transform: translate(-2.4vw, -3.2vh) scale(0.98);
            }

            35% {
                transform: translate(2.2vw, -1.4vh) scale(1);
            }

            70% {
                transform: translate(1vw, 2.6vh) scale(1.015);
            }

            100% {
                transform: translate(-1.8vw, 1.8vh) scale(0.99);
            }
        }

        @media (max-width: 700px) {
            .mark {
                gap: 16px;
            }

            .ring {
                width: 92px;
                height: 92px;
                border-width: 7px;
            }

            .word {
                font-size: 64px;
            }
        }
    </style>
</head>
<body>
    <div class="mark" aria-label="OxyPeak">
        <div class="ring"></div>
        <div class="word">Oxy<span>Peak</span></div>
    </div>
</body>
</html>
