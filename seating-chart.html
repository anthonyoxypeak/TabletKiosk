<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Seating Chart · OxyPeak</title>
    <style>
        :root { color-scheme: light; --bg:#f4f7f9; --card:#fff; --text:#173048; --muted:#526b7c; --line:#d9e5e9; --accent:#247f73; }
        @media (prefers-color-scheme: dark) { :root { color-scheme:dark; --bg:#101c29; --card:#1a2b3c; --text:#f1f6fa; --muted:#b4c7d2; --line:#354b5c; --accent:#83d7c4; } }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font:20px/1.5 system-ui,sans-serif; }
        main { max-width:1120px; margin:auto; padding:32px; }
        header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:36px; }
        .brand { color:var(--accent); font-weight:800; letter-spacing:.03em; }
        a, button { display:inline-block; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:14px; padding:14px 20px; font:inherit; text-decoration:none; cursor:pointer; min-height:56px; }
        a:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
        .eyebrow { color:var(--accent); font-size:16px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
        h1 { font-size:clamp(32px,5vw,48px); line-height:1.15; margin:8px 0 12px; }
        .subtitle { margin:0; color:var(--muted); }
        #status { min-height:30px; color:var(--muted); margin:24px 0; }
        #seats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; padding:0; list-style:none; }
        .seat { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; min-height:128px; }
        .seat.mine { border:2px solid var(--accent); padding:19px; }
        .seat-label { display:block; color:var(--muted); font-size:16px; }
        .name { display:block; margin-top:8px; font-size:26px; font-weight:700; overflow-wrap:anywhere; }
        .empty .name { font-size:20px; color:var(--muted); font-weight:400; }
        footer { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:28px; color:var(--muted); font-size:16px; }
        @media(max-width:700px) { main { padding:20px; } #seats { grid-template-columns:repeat(2,minmax(0,1fr)); } header { margin-bottom:24px; } .name { font-size:23px; } }
    </style>
</head>
<body>
<main>
    <header><span class="brand">OxyPeak</span><a id="back" href="seat.html">← Back to home</a></header>
    <div class="eyebrow" id="suite">Current dive</div>
    <h1>Seating Chart</h1>
    <p class="subtitle">Who's sitting where in your current dive.</p>
    <p id="status" role="status" aria-live="polite">Loading the current dive…</p>
    <ul id="seats" aria-label="Seats in the current dive"></ul>
    <footer><span>First names and nicknames only.</span><button id="refresh" type="button">Refresh</button></footer>
</main>
<script>
    const params = new URLSearchParams(location.search);
    const chamber = params.get('chamber') || '1';
    const seat = params.get('seat') || '1';
    const storageKey = `oxypeak-chart-key:${chamber}:${seat}`;
    const fragment = new URLSearchParams(location.hash.slice(1));
    let apiKey = fragment.get('key') || '';
    try {
        if (apiKey) sessionStorage.setItem(storageKey, apiKey);
        else apiKey = sessionStorage.getItem(storageKey) || '';
    } catch (_) { /* Navigation still works without browser storage. */ }
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    const remoteApi = 'https://oxypeak-to-tablets-grc7htdehuhea4b5.centralus-01.azurewebsites.net';
    const apiBase = (params.get('api') || (location.protocol === 'file:' || location.hostname.endsWith('github.io')
        ? remoteApi : location.origin)).replace(/\/$/, '');
    const backUrl = new URL('seat.html', location.href);
    backUrl.search = params.toString();
    // Existing tablet URLs use the shared key. Keep it available when returning home.
    if (apiKey) backUrl.searchParams.set('key', apiKey);
    document.getElementById('back').href = backUrl.toString();
    document.getElementById('suite').textContent = `Suite ${chamber} · Current dive`;
    const status = document.getElementById('status');
    const seats = document.getElementById('seats');
    const refresh = document.getElementById('refresh');
    let expiry;
    let request;
    let generation = 0;

    function clearChart(message) {
        clearTimeout(expiry);
        seats.replaceChildren();
        status.textContent = message;
    }

    async function loadChart() {
        if (document.hidden) return;
        const current = ++generation;
        if (request) request.abort();
        request = new AbortController();
        const controller = request;
        const started = performance.now();
        const timeout = setTimeout(() => controller.abort(), 8000);
        refresh.disabled = true;
        try {
            const query = new URLSearchParams({ chamber, seat });
            const response = await fetch(`${apiBase}/api/tablet/seating-chart?${query}`, {
                cache:'no-store', signal:controller.signal,
                headers:{ Accept:'application/json', ...(apiKey ? { 'X-Kiosk-Key':apiKey } : {}) }
            });
            if (!response.ok) throw new Error('Unable to load');
            const data = await response.json();
            if (current !== generation || document.hidden) return;
            clearChart('No dive is currently in progress.');
            if (data.unavailable) { status.textContent = 'Seating chart is unavailable. Please ask a team member.'; return; }
            if (!data.dive) return;
            const remaining = Date.parse(data.validUntil) - Date.parse(data.fetchedAt) - (performance.now() - started);
            if (!Number.isFinite(remaining) || remaining <= 0) return;
            const ownSeat = Number(data.seatNumber ?? seat);
            const roster = new Map(data.seats.map(item => [item.seatNumber, item.name]));
            for (let number = 1; number <= 14; number++) {
                const item = document.createElement('li');
                const occupied = roster.has(number);
                item.className = `seat${number === ownSeat ? ' mine' : ''}${occupied ? '' : ' empty'}`;
                const label = document.createElement('span');
                label.className = 'seat-label';
                label.textContent = `Seat ${number}${number === ownSeat ? ' · You' : ''}`;
                const name = document.createElement('span');
                name.className = 'name';
                name.textContent = occupied ? roster.get(number) : 'Unassigned';
                item.append(label, name);
                seats.append(item);
            }
            const format = new Intl.DateTimeFormat('en-US', { hour:'numeric', minute:'2-digit', timeZone:data.facilityTimeZone || 'America/New_York' });
            status.textContent = `${format.format(new Date(data.dive.startTime))} – ${format.format(new Date(data.dive.endTime))} · Updates automatically`;
            expiry = setTimeout(() => {
                clearChart('Refreshing the current dive…');
                loadChart();
            }, Math.min(remaining, 25000));
        } catch (_) {
            if (current === generation) clearChart('Seating chart is unavailable. Tap Refresh to try again.');
        } finally {
            clearTimeout(timeout);
            if (current === generation) refresh.disabled = false;
        }
    }
    refresh.addEventListener('click', loadChart);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            generation++;
            if (request) request.abort();
            clearChart('Loading the current dive…');
        } else loadChart();
    });
    window.addEventListener('pagehide', () => {
        generation++;
        if (request) request.abort();
        clearChart('Loading the current dive…');
    });
    window.addEventListener('pageshow', loadChart);
    setInterval(loadChart, 15000);
</script>
</body>
</html>
